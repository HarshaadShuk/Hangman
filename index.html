<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman</title>
<style>
/* ============ 2. CSS — chalkboard classroom theme ============ */
:root{
  --background:#2b1c12; --surface:rgba(255,255,255,.06); --surface-hover:rgba(255,255,255,.12);
  --border:rgba(244,241,230,.28); --text:#F4F1E6; --muted:#B9C6B8; --accent:#F2D479;
  --accent-soft:rgba(242,212,121,.16); --danger:#FF9B8A; --success:#C4EBA0; --radius:10px;
  --board:#244338; --wood:#8A5A33; --tile:#EFE0B8;
  --font:"Chalkboard SE","Bradley Hand","Segoe Print","Marker Felt","Comic Neue",cursive,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 90% at 50% 20%,transparent 40%,rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#3a2616 0 3px,#33210f 3px 9px,#3d2918 9px 12px);
  background-color:var(--background);color:var(--text);font-family:var(--font);line-height:1.4;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.label{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.app{max-width:1120px;margin:0 auto;padding:20px 16px 32px;animation:enter .6s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.screen[hidden]{display:none}
/* chalkboard in a wooden frame */
.glass{background:radial-gradient(90% 80% at 30% 20%,#2f5446,var(--board) 70%);border:10px solid var(--wood);border-radius:var(--radius);
  box-shadow:inset 0 0 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35),0 18px 40px -10px rgba(0,0,0,.8),0 0 0 2px #5b3a1e}

header{display:grid;grid-template-columns:1fr auto 1fr;gap:12px 20px;align-items:center;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.2em;font-size:20px;color:var(--tile)}
.lvl{text-align:center;min-width:220px}
.lvl b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--tile)}
.bar{height:8px;border-radius:9px;background:rgba(0,0,0,.45);margin-top:8px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--accent) 0 8px,#d9b95e 8px 16px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scores{display:flex;gap:22px;justify-content:flex-end}
.scores div{text-align:right}
.scores b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--tile)}
.scores .hi b{color:var(--accent)}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18);color:var(--success)}}

.board{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:18px}
.side{padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px}
.main{padding:28px clamp(16px,3vw,36px);display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;overflow:hidden}
#stage{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;transition:opacity .25s,transform .25s}
#stage.out{opacity:0;transform:translateY(10px)}
.badge{padding:4px 16px;border:2px solid var(--accent);border-radius:99px 80px 95px 70px;color:var(--accent);font-size:15px;font-weight:700;transform:rotate(-2deg)}
.q{font-size:clamp(21px,2.8vw,30px);text-align:center;max-width:34ch;text-wrap:balance}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px;width:100%;min-height:60px;--s:48px}
.w{display:flex;gap:calc(var(--s)*.14);white-space:nowrap}
.slot{width:var(--s);height:calc(var(--s)*1.25);display:grid;place-items:center;border-bottom:4px solid var(--border);
  font-size:calc(var(--s)*.85);font-weight:700;transition:border-color .3s,background .3s}
.slot.on{border-color:var(--accent)}
.slot.on span{animation:rise .35s cubic-bezier(.2,.9,.3,1.3)}
.slot.pop{background:rgba(242,212,121,.25)}
.slot.miss{border-color:var(--danger);color:var(--danger)}
.slot.done{border-color:var(--success);color:var(--success)}
.punct{width:calc(var(--s)*.5);display:grid;place-items:end center;font-size:calc(var(--s)*.85);color:var(--muted);height:calc(var(--s)*1.25)}
@keyframes rise{from{opacity:0;transform:translateY(60%) scale(.6)}}

.dots{display:flex;gap:9px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--accent);transition:all .3s}
.dots i.lost{background:transparent;border-color:var(--muted);transform:scale(.8);animation:pulse .4s}
@keyframes pulse{40%{transform:scale(1.5);border-color:var(--danger)}}
.att{display:flex;flex-direction:column;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.att b{font-size:20px}
svg{width:100%;max-width:220px;height:auto;overflow:visible}
svg path,svg circle{fill:none;stroke:var(--text);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
svg .ghost{stroke:var(--border);stroke-dasharray:3 7;opacity:.6}
svg .part{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
svg .part.wood{stroke:#C58B52;stroke-width:6}
svg .part.on{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset .45s ease,opacity .1s}
svg .part.bad{stroke:var(--danger)}

/* Scrabble-style tiles, QWERTY layout */
.kb{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:720px}
.kb-row{display:flex;justify-content:center;gap:8px;width:100%}
.kb-row:nth-child(2){width:94%}
.kb-row:nth-child(3){width:82%}
.key{flex:1;min-width:0;aspect-ratio:1/1.08;max-height:58px;border-radius:6px;font-weight:800;font-size:clamp(14px,2.8vw,22px);
  background:linear-gradient(180deg,#f6ebc9,var(--tile));color:#3b2a1a;border-bottom:4px solid #b89a5e;box-shadow:0 3px 6px rgba(0,0,0,.4);
  transition:transform .12s,opacity .2s,box-shadow .12s,border-width .12s}
.key:hover:not(:disabled){transform:translateY(-3px) rotate(-2deg)}
.key:active:not(:disabled){transform:translateY(2px);border-bottom-width:1px;box-shadow:none}
.key:disabled{cursor:default}
.key.ok{background:#B5D993;border-bottom-color:#7da35a;color:#1d3a14}
.key.no{background:#5a4638;border-bottom-color:#3a2c22;color:#d9b9a8;opacity:.55;text-decoration:line-through;box-shadow:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,38,31,.9);z-index:5;animation:fade .3s}
.ov[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.ov .card{text-align:center;padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .4s cubic-bezier(.2,.9,.3,1.2)}
.ov h2{font-size:36px}
.ov h2.win{color:var(--success)} .ov h2.lose{color:var(--danger)}
.ans{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:.06em;word-break:break-word;color:var(--accent)}
.btn{margin-top:10px;padding:13px 32px;border-radius:8px;font-weight:800;font-size:18px;letter-spacing:.05em;background:var(--accent);color:#2b1f10;
  border-bottom:5px solid #b8943a;box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px) rotate(-1deg);filter:brightness(1.06)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}

.hero{max-width:640px;margin:8vh auto 0;padding:clamp(28px,6vw,56px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.hero h1{font-size:clamp(40px,10vw,76px);letter-spacing:.14em;padding-left:.14em;font-weight:800}
.hero p{color:var(--muted);font-size:20px}
.facts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.facts span{font-size:15px;color:var(--muted);border:2px dashed var(--border);padding:4px 12px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:100%;margin-top:10px}
.stats div{padding:16px;border:2px dashed var(--border);border-radius:8px}
.stats b{display:block;font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--accent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:40%;width:9px;height:13px;border-radius:2px;animation:fly 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:820px){
  header{grid-template-columns:1fr 1fr}
  .lvl{grid-row:2;grid-column:1/-1;min-width:0}
  .board{grid-template-columns:1fr}
  .side{flex-direction:row;justify-content:space-around;padding:14px}
  svg{max-width:130px}
  .main{padding:22px 12px}
}
@media (max-width:560px){
  .kb,.kb-row{gap:5px}.kb-row:nth-child(2){width:96%}.kb-row:nth-child(3){width:88%}
  .scores{gap:14px}.scores b{font-size:20px}.word{gap:12px 18px}.glass{border-width:7px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="app">

          <div class="card" role="dialog" aria-live="assertive">

            <div class="label" id="ovP"></div>
            <button class="btn" id="ovB"></button>
          </div>
        </div>
      </main>
    </div>
  </section>

  <section class="screen" id="done" hidden>
    <div class="hero glass">
      <h1 style="font-size:clamp(28px,6vw,48px);letter-spacing:.1em">ALL LEVELS COMPLETE</h1>
      <p id="doneSub"></p>
      <div class="stats" id="stats"></div>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
    </div>
  </section>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite"></div>

let LEVELS = [];
const N = BASE.length, MAX = 7;
/* Every new run reshuffles within each difficulty tier, so difficulty still ramps up */
function buildLevels() {
  const tiers = [[], [], [], [], []];
  BASE.forEach(l => tiers[l.tier].push(l));
  LEVELS = tiers.flatMap(t => { for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; });
}

/* ============ 3. JAVASCRIPT ============ */
const $ = s => document.querySelector(s);
const state = { phase: "start", currentLevel: 1, score: 0, highScore: 0, attemptsRemaining: MAX,
  guessedLetters: [], incorrectGuesses: [], levelsCompleted: 0, totalIncorrectGuesses: 0, totalGuesses: 0, lastPoints: 0 };
let busy = false, shownScore = 0;
const cur = () => LEVELS[state.currentLevel - 1];
const isLetter = c => /[A-Z]/.test(c);
const fmt = n => n.toLocaleString("en-US");
const later = (fn, ms) => setTimeout(fn, ms);
const show = id => document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);

function initGame() {
  $("#sub").textContent = `${N} challenges. 7 attempts. Miss one word and the run starts over.`;
  $("#f1").textContent = `${N} levels`;
  const kb = $("#kb");
  ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"].forEach(row => {
    const r = document.createElement("div"); r.className = "kb-row";
    for (const ch of row) {
      const b = document.createElement("button");
      b.className = "key"; b.textContent = ch; b.dataset.k = ch; b.setAttribute("aria-label", "Letter " + ch);
      b.addEventListener("click", () => handleGuess(ch));
      r.appendChild(b);
    }
    kb.appendChild(r);
  });
  $("#dots").innerHTML = "<i></i>".repeat(MAX);
  $("#startBtn").onclick = () => { resetGame(); };
  $("#againBtn").onclick = () => { resetGame(); };
  document.addEventListener("keydown", onKey);
  addEventListener("resize", fitWord);
  show("start");
  $("#startBtn").focus();
}

function resetGame() {
  buildLevels();
  Object.assign(state, { phase: "play", currentLevel: 1, score: 0, levelsCompleted: 0, totalIncorrectGuesses: 0, totalGuesses: 0 });
  shownScore = 0; busy = false;
  show("game");
  loadLevel();
}

function loadLevel() {
  Object.assign(state, { attemptsRemaining: MAX, guessedLetters: [], incorrectGuesses: [], phase: "play" });
  $("#ov").hidden = true;
  document.querySelectorAll(".key").forEach(k => { k.disabled = false; k.className = "key"; });
  document.querySelectorAll("#gallows .part").forEach(p => p.classList.remove("on", "bad"));
  renderQuestion(); renderWord(); updateUI();
  $("#live").textContent = `Level ${state.currentLevel}. ${cur().category}. ${cur().question}`;
  busy = false;
}

function renderQuestion() { $("#cat").textContent = cur().category; $("#q").textContent = cur().question; }

/* Builds word groups; spaces separate groups, other punctuation is shown for free */
function renderWord(fresh, reveal) {
  const el = $("#word"); el.innerHTML = "";
  cur().answer.split(" ").forEach(w => {
    const g = document.createElement("div"); g.className = "w";
    for (const ch of w) {
      const s = document.createElement("div");
      if (!isLetter(ch)) { s.className = "punct"; s.textContent = ch; }
      else {
        const open = state.guessedLetters.includes(ch);
        s.className = "slot" + (open ? " on" : "") + (reveal && !open ? " miss" : "") + (ch === fresh ? " pop" : "");
        s.innerHTML = `<span>${open || reveal ? ch : ""}</span>`;
        if (reveal && !open) s.firstChild.style.animation = "none";
      }
      g.appendChild(s);
    }
    el.appendChild(g);
  });
  fitWord();
}

/* Scale slots so the longest word fits the container */
function fitWord() {
  const el = $("#word"); if (!el.firstChild) return;
  const longest = Math.max(...cur().answer.split(" ").map(w => w.length));
  const w = el.clientWidth || 300;
  el.style.setProperty("--s", Math.max(18, Math.min(52, Math.floor(w / (longest * 1.18)))) + "px");
}

function renderKeyboard(letter, cls) { const k = document.querySelector(`.key[data-k="${letter}"]`); k.disabled = true; k.classList.add(cls); }

function handleGuess(letter) {
  if (busy || state.phase !== "play" || state.guessedLetters.includes(letter)) return;
  state.guessedLetters.push(letter); state.totalGuesses++;
  cur().answer.includes(letter) ? handleCorrectGuess(letter) : handleIncorrectGuess(letter);
}

function handleCorrectGuess(letter) {
  renderKeyboard(letter, "ok"); renderWord(letter);
  later(() => document.querySelectorAll(".slot.pop").forEach(s => s.classList.remove("pop")), 500);
  checkWin();
}

function handleIncorrectGuess(letter) {
  state.incorrectGuesses.push(letter); state.attemptsRemaining--; state.totalIncorrectGuesses++;
  renderKeyboard(letter, "no"); updateUI();
  const p = $("#panel"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
  checkGameOver();
}

const checkWin = () => { if ([...cur().answer].every(c => !isLetter(c) || state.guessedLetters.includes(c))) win(); };
const checkGameOver = () => { if (state.attemptsRemaining <= 0) lose(); };
const calculateScore = () => 100 + state.attemptsRemaining * 10;

function win() {
  state.phase = "won"; busy = true;
  const pts = calculateScore(); state.lastPoints = pts;
  state.score += pts; state.levelsCompleted++;
  state.highScore = Math.max(state.highScore, state.score);
  document.querySelectorAll(".slot").forEach(s => s.classList.add("done"));
  confetti(); updateUI();
  const last = state.currentLevel === N;
  later(() => showResult("win", pts, last ? "FINISH" : "NEXT LEVEL"), 800);
}

function lose() {
  state.phase = "lost"; busy = true;
  renderWord(null, true);
  document.querySelectorAll("#gallows .part").forEach(p => p.classList.add("bad"));
  later(() => showResult("lose", 0, "NEW GAME"), 900);
}

function showResult(type, pts, label) {
  $("#ovT").textContent = type === "win" ? "Correct!" : "Out of attempts";
  $("#ovT").className = type === "win" ? "win" : "lose";
  $("#ovS").textContent = type === "win" ? "The answer" : "The answer was:";
  $("#ovA").textContent = cur().answer;
  $("#ovP").textContent = type === "win" ? `Score earned: +${pts}` : `Run ended at level ${state.currentLevel} with ${fmt(state.score)} points. Best this session: ${fmt(state.highScore)}`;
  const b = $("#ovB"); b.textContent = label;
  b.onclick = type === "win" ? nextLevel : newRun;
  $("#ov").hidden = false; b.focus(); busy = false;
  $("#live").textContent = $("#ovT").textContent + " " + cur().answer;
}

function transition(fn) {
  busy = true; const st = $("#stage"); $("#ov").hidden = true;
  st.classList.add("out");
  later(() => { fn(); st.classList.remove("out"); }, 260);
}
function nextLevel() {
  if (busy) return;
  if (state.currentLevel >= N) return endGame();
  transition(() => { state.currentLevel++; loadLevel(); });
}
/* Losing a level restarts the whole run with a fresh shuffle; the session high score is kept */
function newRun() { if (!busy) resetGame(); }

function endGame() {
  state.phase = "done"; show("done");
  const acc = state.totalGuesses ? Math.round(100 * (state.totalGuesses - state.totalIncorrectGuesses) / state.totalGuesses) : 100;
  $("#doneSub").textContent = `You conquered all ${N} challenges.`;
  const rows = [["Final score", fmt(state.score)], ["Highest session score", fmt(state.highScore)], ["Levels completed", state.levelsCompleted], ["Accuracy", acc + "%"], ["Incorrect guesses", state.totalIncorrectGuesses]];
  $("#stats").innerHTML = rows.map(([l, v]) => `<div><span class="label">${l}</span><b>${v}</b></div>`).join("");
  confetti(); $("#againBtn").focus();
}

function updateUI() {
  $("#lvl").textContent = `LEVEL ${state.currentLevel} / ${N}`;
  $("#prog").style.width = (state.levelsCompleted / N * 100) + "%";
  $("#high").textContent = fmt(state.highScore);
  const a = state.attemptsRemaining;
  document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("lost", i >= a));
  $("#attTxt").textContent = `${a} / ${MAX}`;
  document.querySelectorAll("#gallows .part").forEach((p, i) => p.classList.toggle("on", i < MAX - a));
  animateScore(state.score);
}

function animateScore(target) {
  const el = $("#score"), from = shownScore, t0 = performance.now();
  if (from === target) { el.textContent = fmt(target); return; }
  el.classList.remove("bump"); void el.offsetWidth; if (target > from) el.classList.add("bump");
  const step = now => {
    const p = Math.min(1, (now - t0) / 500);
    shownScore = Math.round(from + (target - from) * (1 - Math.pow(1 - p, 3)));
    el.textContent = fmt(shownScore);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function confetti() {
  const box = $("#confetti"), cols = ["#F2D479", "#C4EBA0", "#F4F1E6", "#FF9B8A"];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("i");
    c.style.left = (35 + Math.random() * 30) + "%"; c.style.background = cols[i % 4];
    c.style.setProperty("--dx", (Math.random() * 600 - 300) + "px");
    c.style.setProperty("--dy", (Math.random() * 400 - 120) + "px");
    c.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    box.appendChild(c); later(() => c.remove(), 1300);
  }
}

function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (state.phase === "play" && k.length === 1 && isLetter(k)) { e.preventDefault(); handleGuess(k); }
  else if (e.key === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON")) {
    if (state.phase === "start") return;
    if (!$("#ov").hidden) $("#ovB").click();
    else if (state.phase === "done") $("#againBtn").click();
  }
}

initGame();
</script>
</body>
</html>
